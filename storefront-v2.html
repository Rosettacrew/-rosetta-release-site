<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>Rosetta Crew Music Group</title><style>:root{--g:#d7ab52;--g2:#f2d18a;--t:#f8f5ee;--m:#aaa298;--line:#3b3122}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#d7ab5225,transparent 34rem),linear-gradient(#050505,#0b0907 60%,#050505);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.wrap{width:min(1120px,100%);margin:auto;padding:28px 20px 72px}.hero{text-align:center;padding:34px 0 36px}.brand{font-size:10px;letter-spacing:.3em;color:var(--g2);font-weight:800}.hero h1{font:700 clamp(44px,10vw,84px)/.92 Georgia,serif;margin:10px 0}.hero p{color:var(--m);letter-spacing:.16em;font-size:12px}.grid{display:grid;gap:28px;align-items:center}.cover{width:min(82vw,430px);aspect-ratio:1/1;object-fit:cover;border-radius:26px;border:1px solid var(--line);box-shadow:0 30px 90px #000a;margin:auto;background:#111}.meta small{color:var(--g);letter-spacing:.2em;font-weight:800}.title{font:700 clamp(48px,12vw,82px)/.9 Georgia,serif;margin:12px 0 8px}.artist{font-size:18px;letter-spacing:.15em;font-weight:900}.price{font-size:38px;color:var(--g2);font-weight:900;margin:20px 0 10px}.desc{color:#c4bcaf;font-size:15px;line-height:1.65;max-width:560px}.buy{display:block;text-align:center;margin-top:22px;text-decoration:none;background:linear-gradient(135deg,#cf9f43,#f3d894);color:#17120a;font-size:18px;font-weight:900;border-radius:14px;padding:17px 20px}.trust{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;color:#8f887e;font-size:11px}.status{margin-top:12px;color:#9f978c;font-size:12px}.more{margin-top:56px}.more h2{font:700 34px Georgia,serif}.cards{display:grid;gap:14px}.card{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);background:#11100d;border-radius:16px;padding:10px}.card img{width:86px;height:86px;object-fit:cover;border-radius:12px}.card strong{display:block}.card span{color:#9e978c;font-size:12px}.card a{color:var(--g2);text-decoration:none;font-weight:800;font-size:12px}.empty,.error{border:1px solid var(--line);background:#11100d;border-radius:18px;padding:22px;text-align:center;color:#b9b1a5}.hidden{display:none}@media(min-width:820px){.grid{grid-template-columns:.9fr 1.1fr;gap:64px}.cards{grid-template-columns:1fr 1fr}.card{grid-template-columns:76px 1fr}.card img{width:76px;height:76px}.card a{grid-column:2}}</style></head><body><main class="wrap"><section class="hero"><div class="brand">ROSETTA CREW MUSIC GROUP</div><h1>Direct to the fans.</h1><p>MUSIC · CULTURE · OWNERSHIP</p></section><section id="loading" class="empty">Loading published releases…</section><section id="error" class="error hidden">Storefront is temporarily unavailable. Please try again shortly.</section><section id="featured" class="grid hidden"><img id="cover" class="cover" alt="Release cover"><div class="meta"><small id="eyebrow">ROSETTA CREW MUSIC GROUP PRESENTS</small><div id="title" class="title"></div><div id="artist" class="artist"></div><div id="status" class="status"></div><div id="price" class="price"></div><div id="desc" class="desc"></div><a id="buy" class="buy" rel="noopener">BUY NOW</a><div class="trust"><span>✓ Secure Stripe checkout</span><span>✓ Direct-to-fan</span><span>✓ Digital delivery</span></div></div></section><section id="more" class="more hidden"><h2>More Releases</h2><div id="cards" class="cards"></div></section></main><script>const API='https://sktgkrcahsxvidzjjxxt.supabase.co/functions/v1/release-storefront';const money=(c,cur='usd')=>new Intl.NumberFormat('en-US',{style:'currency',currency:String(cur).toUpperCase()}).format((Number(c)||0)/100);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw new Error('storefront');const j=await r.json();const list=j.releases||[];document.getElementById('loading').classList.add('hidden');if(!list.length){document.getElementById('loading').textContent='No releases are currently available.';document.getElementById('loading').classList.remove('hidden');return}const f=j.featured||list[0];document.getElementById('cover').src=f.cover_url;document.getElementById('title').textContent=f.title;document.getElementById('artist').textContent=String(f.artist_name||'').toUpperCase();document.getElementById('price').textContent=money(f.price_cents,f.currency);document.getElementById('desc').textContent=f.description||'Own the official digital release and support the artist directly through Rosetta Crew Music Group.';document.getElementById('status').textContent=f.status==='presale'?`PRE-ORDER · RELEASES ${new Date(f.release_at).toLocaleDateString()}`:'AVAILABLE NOW';const buy=document.getElementById('buy');buy.href=f.checkout_url;buy.textContent=(f.status==='presale'?'PRE-ORDER — ':'BUY NOW — ')+money(f.price_cents,f.currency);document.getElementById('featured').classList.remove('hidden');const rest=list.filter(x=>x.id!==f.id);if(rest.length){document.getElementById('cards').innerHTML=rest.map(x=>`<article class="card"><img src="${esc(x.cover_url)}" alt="${esc(x.title)} cover"><div><strong>${esc(x.artist_name)} — ${esc(x.title)}</strong><span>${x.status==='presale'?'Pre-order':'Available now'} · ${money(x.price_cents,x.currency)}</span></div><a href="${esc(x.checkout_url)}" rel="noopener">${x.status==='presale'?'PRE-ORDER':'BUY'} →</a></article>`).join('');document.getElementById('more').classList.remove('hidden')}}catch(e){document.getElementById('loading').classList.add('hidden');document.getElementById('error').classList.remove('hidden')}}load();</script></body></html>
