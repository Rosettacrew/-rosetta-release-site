<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#070707" />
    <title>Rosetta Crew Music Group</title>
    <meta
      name="description"
      content="Big Hess — Come Here. Official digital single from Rosetta Crew Music Group. Direct-to-fan checkout — $1.99."
    />
    <link
      rel="canonical"
      href="https://rosettacrew.github.io/-rosetta-release-site/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rosetta Crew Music Group" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:url"
      content="https://rosettacrew.github.io/-rosetta-release-site/"
    />
    <meta
      property="og:title"
      content="Big Hess — Come Here | Rosetta Crew Music Group"
    />
    <meta
      property="og:description"
      content="Big Hess — Come Here. Rosetta Crew Music Group single release. Available now — $1.99."
    />
    <meta
      property="og:image"
      content="https://sktgkrcahsxvidzjjxxt.supabase.co/storage/v1/object/public/release-public/a9ee15b1-cd7c-424f-a707-15b6e564a2b0/cover/cover-f71d1a1c-83d0-4c42-97fe-720801515813.jpeg"
    />
    <meta property="og:image:alt" content="Big Hess — Come Here" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Big Hess — Come Here | Rosetta Crew Music Group"
    />
    <meta
      name="twitter:description"
      content="Big Hess — Come Here. Rosetta Crew Music Group single release. Available now — $1.99."
    />
    <meta
      name="twitter:image"
      content="https://sktgkrcahsxvidzjjxxt.supabase.co/storage/v1/object/public/release-public/a9ee15b1-cd7c-424f-a707-15b6e564a2b0/cover/cover-f71d1a1c-83d0-4c42-97fe-720801515813.jpeg"
    />
    <meta name="twitter:image:alt" content="Big Hess — Come Here" />
    <style>
      :root {
        --g: #d7ab52;
        --g2: #f2d18a;
        --t: #f8f5ee;
        --m: #aaa298;
        --line: #3b3122;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 50% -10%, #d7ab5225, transparent 34rem),
          linear-gradient(#050505, #0b0907 60%, #050505);
        color: var(--t);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .wrap {
        width: min(1120px, 100%);
        margin: auto;
        padding: 28px 20px 72px;
      }
      .hero {
        text-align: center;
        padding: 34px 0 36px;
      }
      .brand {
        font-size: 10px;
        letter-spacing: 0.3em;
        color: var(--g2);
        font-weight: 800;
      }
      .hero h1 {
        font:
          700 clamp(44px, 10vw, 84px) / 0.92 Georgia,
          serif;
        margin: 10px 0;
      }
      .hero p {
        color: var(--m);
        letter-spacing: 0.16em;
        font-size: 12px;
      }
      .grid {
        display: grid;
        gap: 28px;
        align-items: center;
      }
      .cover {
        width: min(82vw, 430px);
        aspect-ratio: 1/1;
        object-fit: contain;
        border-radius: 26px;
        border: 1px solid var(--line);
        box-shadow: 0 30px 90px #000a;
        margin: auto;
        background: #111;
      }
      .meta small {
        color: var(--g);
        letter-spacing: 0.2em;
        font-weight: 800;
      }
      .title {
        font:
          700 clamp(48px, 12vw, 82px) / 0.9 Georgia,
          serif;
        margin: 12px 0 8px;
      }
      .artist {
        font-size: 18px;
        letter-spacing: 0.15em;
        font-weight: 900;
      }
      .price {
        font-size: 38px;
        color: var(--g2);
        font-weight: 900;
        margin: 20px 0 10px;
      }
      .desc {
        color: #c4bcaf;
        font-size: 15px;
        line-height: 1.65;
        max-width: 560px;
      }
      .buy {
        display: block;
        text-align: center;
        margin-top: 22px;
        text-decoration: none;
        background: linear-gradient(135deg, #cf9f43, #f3d894);
        color: #17120a;
        font-size: 18px;
        font-weight: 900;
        border-radius: 14px;
        padding: 17px 20px;
      }
      .buy.disabled {
        cursor: default;
        opacity: 0.72;
      }
      .trust {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 15px;
        color: #8f887e;
        font-size: 11px;
      }
      .status {
        margin-top: 12px;
        color: #9f978c;
        font-size: 12px;
      }
      .more {
        margin-top: 56px;
      }
      .more h2 {
        font:
          700 34px Georgia,
          serif;
      }
      .cards {
        display: grid;
        gap: 14px;
      }
      .card {
        display: grid;
        grid-template-columns: 86px 1fr auto;
        gap: 14px;
        align-items: center;
        border: 1px solid var(--line);
        background: #11100d;
        border-radius: 16px;
        padding: 10px;
      }
      .card img {
        width: 86px;
        height: 86px;
        object-fit: contain;
        background: #0b0b0b;
        border-radius: 12px;
      }
      .card strong {
        display: block;
      }
      .card span {
        color: #9e978c;
        font-size: 12px;
      }
      .card a {
        color: var(--g2);
        text-decoration: none;
        font-weight: 800;
        font-size: 12px;
      }
      .empty,
      .error {
        border: 1px solid var(--line);
        background: #11100d;
        border-radius: 18px;
        padding: 22px;
        text-align: center;
        color: #b9b1a5;
      }
      .hidden {
        display: none;
      }
      @media (min-width: 820px) {
        .grid {
          grid-template-columns: 0.9fr 1.1fr;
          gap: 64px;
        }
        .cards {
          grid-template-columns: 1fr 1fr;
        }
        .card {
          grid-template-columns: 76px 1fr;
        }
        .card img {
          width: 76px;
          height: 76px;
        }
        .card a {
          grid-column: 2;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <div class="brand">ROSETTA CREW MUSIC GROUP</div>
        <h1>Direct to the fans.</h1>
        <p>MUSIC · CULTURE · OWNERSHIP</p>
      </section>
      <section id="loading" class="empty">Loading published releases…</section>
      <section id="error" class="error hidden">
        Storefront is temporarily unavailable. Please try again shortly.
      </section>
      <section id="featured" class="grid hidden">
        <img id="cover" class="cover" alt="Release cover" />
        <div class="meta">
          <small>ROSETTA CREW MUSIC GROUP PRESENTS</small>
          <div id="title" class="title"></div>
          <div id="artist" class="artist"></div>
          <div id="status" class="status"></div>
          <div id="price" class="price"></div>
          <div id="desc" class="desc"></div>
          <a id="buy" class="buy" rel="noopener">BUY NOW</a>
          <div id="trust" class="trust">
            <span>✓ Secure Stripe checkout</span><span>✓ Direct-to-fan</span
            ><span>✓ Digital delivery</span>
          </div>
        </div>
      </section>
      <section id="more" class="more hidden">
        <h2>More Releases</h2>
        <div id="cards" class="cards"></div>
      </section>
    </main>
    <script>
      const API =
          "https://sktgkrcahsxvidzjjxxt.supabase.co/functions/v1/release-storefront",
        AN =
          "https://sktgkrcahsxvidzjjxxt.supabase.co/functions/v1/release-analytics";
      const money = (c, cur = "usd") =>
        new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: String(cur).toUpperCase(),
        }).format((Number(c) || 0) / 100);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      function setMeta(attr, key, content) {
        let el = document.querySelector("meta[" + attr + '="' + key + '"]');
        if (!el) {
          el = document.createElement("meta");
          el.setAttribute(attr, key);
          document.head.appendChild(el);
        }
        el.setAttribute("content", content);
      }
      function applyShare(f) {
        const price = money(f.price_cents, f.currency),
          name = String(f.artist_name || "").trim(),
          ttl = String(f.title || "Release").trim(),
          title =
            (name ? name + " — " + ttl : ttl) + " | Rosetta Crew Music Group",
          base = String(
            f.description ||
              (name ? name + " — " : "") +
                ttl +
                ". Official digital release from Rosetta Crew Music Group.",
          ).trim(),
          share = base.includes(price)
            ? base
            : base.replace(/\.?$/, "") + ". Available now — " + price + ".";
        document.title = title;
        setMeta("name", "description", share);
        setMeta("property", "og:title", title);
        setMeta("property", "og:description", share);
        setMeta("name", "twitter:title", title);
        setMeta("name", "twitter:description", share);
        if (f.cover_url) {
          setMeta("property", "og:image", f.cover_url);
          setMeta("name", "twitter:image", f.cover_url);
          setMeta("property", "og:image:alt", name ? name + " — " + ttl : ttl);
          setMeta("name", "twitter:image:alt", name ? name + " — " + ttl : ttl);
        }
      }
      const id = (k, store) => {
        let v = store.getItem(k);
        if (!v) {
          v = crypto.randomUUID();
          store.setItem(k, v);
        }
        return v;
      };
      const visitor = id("rc_visitor", localStorage),
        sessionId = id("rc_session", sessionStorage),
        params = new URLSearchParams(location.search),
        previewOnly = params.get("admin_preview") === "1",
        source = params.get("utm_source") || params.get("source") || null,
        campaign = params.get("utm_campaign") || null;
      function track(product_id, event_type, metadata = {}) {
        if (previewOnly || !product_id) return;
        fetch(AN, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            product_id,
            event_type,
            visitor_id: visitor,
            session_id: sessionId,
            source,
            campaign,
            referrer: document.referrer || null,
            metadata,
          }),
          keepalive: true,
        }).catch(() => {});
      }
      async function load() {
        try {
          let j;
          if (previewOnly) {
            const preview = JSON.parse(
              sessionStorage.getItem("rosetta_customer_preview") || "null",
            );
            if (
              !preview ||
              preview.id !== params.get("product_id") ||
              preview.preview_only !== true
            )
              throw new Error("preview");
            j = { featured: preview, releases: [preview] };
          } else {
            const r = await fetch(API, { cache: "no-store" });
            if (!r.ok) throw new Error("storefront");
            j = await r.json();
          }
          const list = j.releases || [];
          document.getElementById("loading").classList.add("hidden");
          if (!list.length) {
            document.getElementById("loading").textContent =
              "No releases are currently available.";
            document.getElementById("loading").classList.remove("hidden");
            return;
          }
          const f = j.featured || list[0];
          document.getElementById("cover").src = f.cover_url;
          document.getElementById("title").textContent = f.title;
          document.getElementById("artist").textContent = String(
            f.artist_name || "",
          ).toUpperCase();
          document.getElementById("price").textContent = money(
            f.price_cents,
            f.currency,
          );
          document.getElementById("desc").textContent =
            f.description ||
            "Own the official digital release and support the artist directly through Rosetta Crew Music Group.";
          document.getElementById("status").textContent =
            f.status === "presale"
              ? `PRE-ORDER · RELEASES ${new Date(f.release_at).toLocaleDateString()}`
              : "AVAILABLE NOW";
          const buy = document.getElementById("buy");
          if (previewOnly) {
            buy.removeAttribute("href");
            buy.removeAttribute("data-product");
            buy.classList.add("disabled");
            buy.setAttribute("aria-disabled", "true");
            buy.textContent =
              "PREVIEW ONLY — " + money(f.price_cents, f.currency);
            document.getElementById("trust").innerHTML =
              "<span>✓ Private admin preview</span><span>✓ Checkout disabled</span>";
          } else {
            buy.href = f.checkout_url;
            buy.dataset.product = f.id;
            buy.textContent =
              (f.status === "presale" ? "PRE-ORDER — " : "BUY NOW — ") +
              money(f.price_cents, f.currency);
          }
          document.getElementById("featured").classList.remove("hidden");
          applyShare(f);
          track(f.id, "page_view", { placement: "featured" });
          /* TODO: optional featured audio preview — release-storefront currently has no preview_url/audio_url; skip player UI until the API exposes a real public preview URL (do not invent files that 404). */ const rest =
            list.filter((x) => x.id !== f.id);
          if (rest.length) {
            document.getElementById("cards").innerHTML = rest
              .map(
                (x) =>
                  `<article class="card"><img src="${esc(x.cover_url)}" alt="${esc(x.title)} cover"><div><strong>${esc(x.artist_name)} — ${esc(x.title)}</strong><span>${x.status === "presale" ? "Pre-order" : "Available now"} · ${money(x.price_cents, x.currency)}</span></div><a href="${esc(x.checkout_url)}" data-product="${esc(x.id)}" rel="noopener">${x.status === "presale" ? "PRE-ORDER" : "BUY"} →</a></article>`,
              )
              .join("");
            document.getElementById("more").classList.remove("hidden");
          }
          if (!previewOnly)
            document.addEventListener(
              "click",
              (e) => {
                const a = e.target.closest("a[data-product]");
                if (a)
                  track(a.dataset.product, "checkout_click", {
                    placement: a.id === "buy" ? "featured" : "release_card",
                  });
              },
              { once: false },
            );
        } catch (e) {
          document.getElementById("loading").classList.add("hidden");
          document.getElementById("error").classList.remove("hidden");
        }
      }
      load();
    </script>
  </body>
</html>
