<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta property="og:site_name" content="Rosetta Crew Music Group" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:url"

    <meta

    />
    <meta

      content="https://sktgkrcahsxvidzjjxxt.supabase.co/storage/v1/object/public/release-public/a9ee15b1-cd7c-424f-a707-15b6e564a2b0/cover/cover-f71d1a1c-83d0-4c42-97fe-720801515813.jpeg"

    />

    <style>
      :root {
        --g: #d7ab52;
        --g2: #f2d18a;
        --t: #f8f5ee;
        --m: #aaa298;
        --line: #3b3122;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 50% -10%, #d7ab5225, transparent 34rem),
          linear-gradient(#050505, #0b0907 60%, #050505);
        color: var(--t);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }
      .wrap {
        width: min(1120px, 100%);
        margin: auto;
        padding: 28px 20px 72px;
      }
      .hero {
        text-align: center;
        padding: 34px 0 36px;
      }
      .brand {
        font-size: 10px;
        letter-spacing: 0.3em;
        color: var(--g2);
        font-weight: 800;
      }
      .hero h1 {
        font:
          700 clamp(44px, 10vw, 84px) / 0.92 Georgia,
          serif;
        margin: 10px 0;
      }
      .hero p {
        color: var(--m);
        letter-spacing: 0.16em;
        font-size: 12px;
      }
      .beatbay-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 14px;
        padding: 11px 16px;
        border: 1px solid var(--g);
        border-radius: 999px;
        color: var(--g2);
        text-decoration: none;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        transition: background 0.2s ease, color 0.2s ease;
      }
      .beatbay-cta:hover,
      .beatbay-cta:focus-visible {
        background: var(--g);
        color: #080705;
      }
      .grid {
        display: grid;
        gap: 28px;
        align-items: center;
      }
      .carousel-shell {
        position: relative;
      }
      .carousel-viewport {
        display: flex;
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
      }
      .carousel-viewport::-webkit-scrollbar {
        display: none;
      }
      .release-slide {
        flex: 0 0 100%;
        min-width: 0;
        padding: 2px 2px 8px;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }
      .carousel-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-top: 24px;
      }
      .carousel-button {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: #11100d;
        color: var(--g2);
        font-size: 24px;
        cursor: pointer;
        transition:
          transform 180ms ease,
          background 180ms ease,
          border-color 180ms ease;
      }
      .carousel-button:hover,
      .carousel-button:focus-visible {
        transform: scale(1.06);
        border-color: var(--g);
        background: #1b1710;
        outline: none;
      }
      .carousel-button:disabled {
        cursor: default;
        opacity: 0.35;
        transform: none;
      }
      .carousel-dots {
        min-width: 70px;
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .carousel-dot {
        width: 10px;
        height: 10px;
        padding: 0;
        border: 1px solid #796443;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        transition:
          width 180ms ease,
          border-radius 180ms ease,
          background 180ms ease;
      }
      .carousel-dot.active {
        width: 28px;
        border-radius: 999px;
        border-color: var(--g2);
        background: var(--g2);
      }
      .swipe-hint {
        margin: 12px 0 0;
        text-align: center;
        color: #8f887e;
        font-size: 12px;
        letter-spacing: 0.06em;
      }
      .cover {
        width: min(82vw, 430px);
        aspect-ratio: 1/1;
        object-fit: contain;
        border-radius: 26px;
        border: 1px solid var(--line);
        box-shadow: 0 30px 90px #000a;
        margin: auto;
        background: #111;
      }
      .meta small {
        color: var(--g);
        letter-spacing: 0.2em;
        font-weight: 800;
      }
      .title {
        font:
          700 clamp(48px, 12vw, 82px) / 0.9 Georgia,
          serif;
        margin: 12px 0 8px;
      }
      .artist {
        font-size: 18px;
        letter-spacing: 0.15em;
        font-weight: 900;
      }
      .artist-type {
        display: inline-flex;
        width: fit-content;
        margin-top: 9px;
        padding: 5px 9px;
        border: 1px solid #796443;
        border-radius: 999px;
        color: var(--g2);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.12em;
      }
      .booking-banner {
        display: block;
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid var(--g);
        border-radius: 14px;
        background: linear-gradient(135deg, #d7ab521c, #11100d);
        color: var(--t);
        text-decoration: none;
        line-height: 1.45;
      }
      .booking-banner strong {
        display: block;
        color: var(--g2);
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      .booking-banner span {
        color: #c4bcaf;
        font-size: 13px;
      }
      .price {
        font-size: 38px;
        color: var(--g2);
        font-weight: 900;
        margin: 20px 0 10px;
      }
      .desc {
        color: #c4bcaf;
        font-size: 15px;
        line-height: 1.65;
        max-width: 560px;
      }
      .buy {
        display: block;
        text-align: center;
        margin-top: 22px;
        text-decoration: none;
        background: linear-gradient(135deg, #cf9f43, #f3d894);
        color: #17120a;
        font-size: 18px;
        font-weight: 900;
        border-radius: 14px;
        padding: 17px 20px;
      }
      .buy.disabled {
        cursor: default;
        opacity: 0.72;
      }
      .support {
        margin-top: 18px;
        padding: 14px 14px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: linear-gradient(160deg, #1a160f, #0e0c09);
      }
      .support-label {
        color: var(--g2);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.18em;
        margin-bottom: 10px;
      }
      .support-presets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      .support-preset {
        border: 1px solid #796443;
        background: #11100d;
        color: var(--g2);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }
      .support-preset:hover,
      .support-preset:focus-visible,
      .support-preset.active {
        border-color: var(--g);
        background: #1b1710;
        outline: none;
      }
      .support-custom {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .support-custom label {
        color: #9f978c;
        font-size: 11px;
        letter-spacing: 0.06em;
      }
      .support-custom input {
        width: 110px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #0a0908;
        color: var(--t);
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 700;
      }
      .support-go {
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, #cf9f43, #f3d894);
        color: #17120a;
        font-size: 13px;
        font-weight: 900;
        padding: 10px 14px;
        cursor: pointer;
      }
      .support-go:disabled {
        opacity: 0.65;
        cursor: default;
      }
      .support-hint {
        margin-top: 8px;
        color: #8f887e;
        font-size: 11px;
      }
      .support-error {
        margin-top: 8px;
        color: #e8a0a0;
        font-size: 12px;
      }
      .checkout-toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: 40;
        max-width: min(520px, calc(100vw - 24px));
        padding: 14px 18px;
        border: 1px solid var(--g);
        border-radius: 14px;
        background: #14110c;
        color: var(--t);
        box-shadow: 0 18px 50px #000a;
        font-size: 13px;
        line-height: 1.45;
      }
      .checkout-toast strong {
        color: var(--g2);
        display: block;
        margin-bottom: 4px;
        letter-spacing: 0.08em;
        font-size: 11px;
      }
      .checkout-toast button {
        margin-top: 8px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--m);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 11px;
      }
      .trust {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 15px;
        color: #8f887e;
        font-size: 11px;
      }
      .status {
        margin-top: 12px;
        color: #9f978c;
        font-size: 12px;
      }
      .empty,
      .error {
        border: 1px solid var(--line);
        background: #11100d;
        border-radius: 18px;
        padding: 22px;
        text-align: center;
        color: #b9b1a5;
      }
      .hidden {
        display: none;
      }
      @media (min-width: 820px) {
        .grid {
          grid-template-columns: 0.9fr 1.1fr;
          gap: 64px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .carousel-viewport {
          scroll-behavior: auto;
        }
        .carousel-button,
        .carousel-dot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero">
        <div class="brand">ROSETTA CREW MUSIC GROUP</div>
        <h1>Direct to the fans.</h1>
        <p>MUSIC · CULTURE · OWNERSHIP</p>
        <a class="beatbay-cta" href="beatbay/">EXPLORE BEATBAY EXCHANGE →</a>
      </section>
      <section id="loading" class="empty">Loading published releases…</section>
      <section id="error" class="error hidden">
        Storefront is temporarily unavailable. Please try again shortly.
      </section>
      <section
        id="release-showcase"
        class="carousel-shell hidden"
        aria-label="Featured releases"
      >
        <div
          id="release-carousel"
          class="carousel-viewport"
          tabindex="0"
          role="region"
          aria-roledescription="carousel"
          aria-label="Rosetta Crew releases"
        ></div>
        <div id="carousel-controls" class="carousel-controls">
          <button
            id="carousel-prev"
            class="carousel-button"
            type="button"
            aria-label="Previous release"
          >
            ‹
          </button>
          <div id="carousel-dots" class="carousel-dots"></div>
          <button
            id="carousel-next"
            class="carousel-button"
            type="button"
            aria-label="Next release"
          >
            ›
          </button>
        </div>
        <p id="swipe-hint" class="swipe-hint">
          Swipe the cover or use the arrows to browse releases
        </p>
      </section>
      <div id="checkout-toast" class="checkout-toast hidden" role="status" aria-live="polite"></div>
    </main>
    <script>
      const FN_BASE =
          "https://sktgkrcahsxvidzjjxxt.supabase.co/functions/v1",
        API = FN_BASE + "/release-storefront",
        AN = FN_BASE + "/release-analytics",
        SUPPORT_API = FN_BASE + "/release-support-checkout";
      const money = (c, cur = "usd") =>
        new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: String(cur).toUpperCase(),
        }).format((Number(c) || 0) / 100);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );

      function supportPresets(floor) {
        const f = Number(floor) || 0;
        if (f === 499) return [499, 799, 999, 1499];
        return [f, f + 300, f + 500, f + 1000].filter((n) => n > 0);
      }
      function supportBlock(release) {
        if (previewOnly) return "";
        const floor = Number(release.price_cents) || 0;
        if (!(floor > 0)) return "";
        const presets = supportPresets(floor);
        const buttons = presets
          .map(
            (c, i) =>
              `<button type="button" class="support-preset${i === 0 ? " active" : ""}" data-cents="${c}">${money(c, release.currency)}</button>`,
          )
          .join("");
        return `<div class="support" data-support-product="${esc(release.id)}" data-floor="${floor}" data-currency="${esc(release.currency || "usd")}"><div class="support-label">SUPPORT THE ARTIST</div><div class="support-presets">${buttons}</div><div class="support-custom"><label>Custom $</label><input type="number" min="${(floor / 100).toFixed(2)}" step="0.01" inputmode="decimal" placeholder="${(floor / 100).toFixed(2)}" aria-label="Custom support amount in dollars" /><button type="button" class="support-go" data-support-go>Support</button></div><div class="support-hint">Minimum ${money(floor, release.currency)}. Same digital release — pay what you can.</div><div class="support-error hidden" data-support-error></div></div>`;
      }

      function setMeta(attr, key, content) {
        let el = document.querySelector("meta[" + attr + '="' + key + '"]');
        if (!el) {
          el = document.createElement("meta");
          el.setAttribute(attr, key);
          document.head.appendChild(el);
        }
        el.setAttribute("content", content);
      }
      function applyShare(f) {
        const price = money(f.price_cents, f.currency),
          name = String(f.artist_name || "").trim(),
          ttl = String(f.title || "Release").trim(),
          title =
            (name ? name + " — " + ttl : ttl) + " | Rosetta Crew Music Group",
          base = String(
            f.description ||
              (name ? name + " — " : "") +
                ttl +
                ". Official digital release from Rosetta Crew Music Group.",
          ).trim(),
          share = base.includes(price)
            ? base
            : base.replace(/\.?$/, "") + ". Available now — " + price + ".";
        document.title = title;
        setMeta("name", "description", share);
        setMeta("property", "og:title", title);
        setMeta("property", "og:description", share);
        setMeta("name", "twitter:title", title);
        setMeta("name", "twitter:description", share);
        if (f.cover_url) {
          setMeta("property", "og:image", f.cover_url);
          setMeta("name", "twitter:image", f.cover_url);
          setMeta("property", "og:image:alt", name ? name + " — " + ttl : ttl);
          setMeta("name", "twitter:image:alt", name ? name + " — " + ttl : ttl);
        }
      }
      const id = (k, store) => {
        let v = store.getItem(k);
        if (!v) {
          v = crypto.randomUUID();
          store.setItem(k, v);
        }
        return v;
      };
      const visitor = id("rc_visitor", localStorage),
        sessionId = id("rc_session", sessionStorage),
        params = new URLSearchParams(location.search),
        previewOnly = params.get("admin_preview") === "1",
        source = params.get("utm_source") || params.get("source") || null,
        campaign = params.get("utm_campaign") || null;
      function track(product_id, event_type, metadata = {}) {
        if (previewOnly || !product_id) return;
        fetch(AN, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            product_id,
            event_type,
            visitor_id: visitor,
            session_id: sessionId,
            source,
            campaign,
            referrer: document.referrer || null,
            metadata,
          }),
          keepalive: true,
        }).catch(() => {});
      }
      function releaseStatus(release) {
        if (release.status !== "presale") return "AVAILABLE NOW";
        if (!release.release_at) return "PRE-ORDER";
        const releaseDate = new Date(release.release_at);
        return Number.isNaN(releaseDate.getTime())
          ? "PRE-ORDER"
          : `PRE-ORDER · RELEASES ${releaseDate.toLocaleDateString()}`;
      }
      function releaseSlide(release, index, total) {
        const artist = String(release.artist_name || "").trim();
        const title = String(release.title || "Release").trim();
        const price = money(release.price_cents, release.currency);
        const description =
          release.description ||
          "Own the official digital release and support the artist directly through Rosetta Crew Music Group.";
        const action = previewOnly
          ? `<span class="buy disabled" aria-disabled="true">PREVIEW ONLY — ${price}</span>`
          : `<a class="buy" href="${esc(release.checkout_url)}" data-product="${esc(release.id)}" rel="noopener">${release.status === "presale" ? "PRE-ORDER" : "BUY NOW"} — ${price}</a>`;
        const trust = previewOnly
          ? "<span>✓ Private admin preview</span><span>✓ Checkout disabled</span>"
          : "<span>✓ Secure Stripe checkout</span><span>✓ Direct-to-fan</span><span>✓ Digital delivery</span>";
        const artistType = release.artist_type === "ai" ? "ai" : release.artist_type === "actual" ? "actual" : null;
        const identity = artistType
          ? `<div class="artist-type">${artistType === "ai" ? "AI ARTIST" : "ACTUAL ARTIST"}</div>`
          : "";
        const booking = artistType === "actual"
          ? previewOnly
            ? `<span class="booking-banner" aria-disabled="true"><strong>BOOK THIS ARTIST</strong><span>Contact Rosetta Crew for booking inquiries · preview link disabled</span></span>`
            : `<a class="booking-banner" href="tel:+16562424777"><strong>BOOK THIS ARTIST</strong><span>Contact Rosetta Crew for booking inquiries · 656-242-4777</span></a>`
          : "";
        return `<article class="release-slide" data-index="${index}" role="group" aria-roledescription="slide" aria-label="${index + 1} of ${total}: ${esc(artist)} — ${esc(title)}"><div class="grid"><img class="cover" src="${esc(release.cover_url)}" alt="${esc(artist)} — ${esc(title)} cover art"><div class="meta"><small>ROSETTA CREW MUSIC GROUP PRESENTS</small><div class="title">${esc(title)}</div><div class="artist">${esc(artist.toUpperCase())}</div>${identity}<div class="status">${esc(releaseStatus(release))}</div><div class="price">${price}</div><div class="desc">${esc(description)}</div>${booking}${action}${supportBlock(release)}<div class="trust">${trust}</div></div></div></article>`;
      }
      async function load() {
        try {
          let j;
          if (previewOnly) {
            const preview = JSON.parse(
              sessionStorage.getItem("rosetta_customer_preview") || "null",
            );
            if (
              !preview ||
              preview.id !== params.get("product_id") ||
              preview.preview_only !== true
            )
              throw new Error("preview");
            j = { featured: preview, releases: [preview] };
          } else {
            const r = await fetch(API, { cache: "no-store" });
            if (!r.ok) throw new Error("storefront");
            j = await r.json();
          }
          const list = j.releases || [];
          document.getElementById("loading").classList.add("hidden");
          if (!list.length) {
            document.getElementById("loading").textContent =
              "No releases are currently available.";
            document.getElementById("loading").classList.remove("hidden");
            return;
          }
          const featured = j.featured || list[0];
          const releases = [
            featured,
            ...list.filter((release) => release.id !== featured.id),
          ];
          const carousel = document.getElementById("release-carousel");
          const dots = document.getElementById("carousel-dots");
          const prev = document.getElementById("carousel-prev");
          const next = document.getElementById("carousel-next");
          const controls = document.getElementById("carousel-controls");
          const hint = document.getElementById("swipe-hint");
          const viewed = new Set();
          let activeIndex = 0;
          let ticking = false;

          carousel.innerHTML = releases
            .map((release, index) =>
              releaseSlide(release, index, releases.length),
            )
            .join("");
          dots.innerHTML = releases
            .map(
              (release, index) =>
                `<button class="carousel-dot${index === 0 ? " active" : ""}" type="button" data-slide="${index}" aria-label="Show ${esc(release.artist_name)} — ${esc(release.title)}" aria-current="${index === 0 ? "true" : "false"}"></button>`,
            )
            .join("");

          function setActive(index) {
            const nextIndex = Math.max(0, Math.min(index, releases.length - 1));
            activeIndex = nextIndex;
            dots.querySelectorAll(".carousel-dot").forEach((dot, dotIndex) => {
              const selected = dotIndex === nextIndex;
              dot.classList.toggle("active", selected);
              dot.setAttribute("aria-current", String(selected));
            });
            prev.disabled = nextIndex === 0;
            next.disabled = nextIndex === releases.length - 1;
            applyShare(releases[nextIndex]);
            if (!viewed.has(releases[nextIndex].id)) {
              viewed.add(releases[nextIndex].id);
              track(releases[nextIndex].id, "page_view", {
                placement: "release_carousel",
                slide: nextIndex + 1,
              });
            }
          }
          function goTo(index) {
            const nextIndex = Math.max(0, Math.min(index, releases.length - 1));
            carousel.scrollTo({
              left: nextIndex * carousel.clientWidth,
              behavior: "smooth",
            });
            setActive(nextIndex);
          }

          prev.addEventListener("click", () => goTo(activeIndex - 1));
          next.addEventListener("click", () => goTo(activeIndex + 1));
          dots.addEventListener("click", (event) => {
            const dot = event.target.closest("button[data-slide]");
            if (dot) goTo(Number(dot.dataset.slide));
          });
          carousel.addEventListener("keydown", (event) => {
            if (event.key === "ArrowLeft") {
              event.preventDefault();
              goTo(activeIndex - 1);
            }
            if (event.key === "ArrowRight") {
              event.preventDefault();
              goTo(activeIndex + 1);
            }
          });
          carousel.addEventListener("scroll", () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
              const width = carousel.clientWidth || 1;
              setActive(Math.round(carousel.scrollLeft / width));
              ticking = false;
            });
          });
          window.addEventListener("resize", () => {
            carousel.scrollTo({
              left: activeIndex * carousel.clientWidth,
              behavior: "auto",
            });
          });

          if (releases.length < 2) {
            controls.classList.add("hidden");
            hint.classList.add("hidden");
          }
          document.getElementById("release-showcase").classList.remove("hidden");
          setActive(0);
          if (!previewOnly) {
            wireSupportUI(carousel);
            document.addEventListener(
              "click",
              (e) => {
                const a = e.target.closest("a[data-product]");
                if (a)
                  track(a.dataset.product, "checkout_click", {
                    placement: "release_carousel",
                  });
              },
              { once: false },
            );
          }
        } catch (e) {
          document.getElementById("loading").classList.add("hidden");
          document.getElementById("error").classList.remove("hidden");
        }
      }

      async function startSupportCheckout(productId, amountCents, errorEl, goBtn) {
        if (errorEl) {
          errorEl.textContent = "";
          errorEl.classList.add("hidden");
        }
        if (goBtn) goBtn.disabled = true;
        try {
          const r = await fetch(SUPPORT_API, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ product_id: productId, amount_cents: amountCents }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok || !data.url) {
            throw new Error(data.error || "Checkout unavailable");
          }
          track(productId, "checkout_click", {
            placement: "support_the_artist",
            amount_cents: amountCents,
          });
          location.href = data.url;
        } catch (err) {
          if (errorEl) {
            errorEl.textContent = err instanceof Error ? err.message : String(err);
            errorEl.classList.remove("hidden");
          }
          if (goBtn) goBtn.disabled = false;
        }
      }
      function wireSupportUI(root) {
        root.addEventListener("click", (e) => {
          const preset = e.target.closest(".support-preset");
          if (preset) {
            const box = preset.closest(".support");
            if (!box) return;
            box.querySelectorAll(".support-preset").forEach((b) => b.classList.remove("active"));
            preset.classList.add("active");
            const input = box.querySelector("input");
            if (input) input.value = (Number(preset.dataset.cents) / 100).toFixed(2);
            return;
          }
          const go = e.target.closest("[data-support-go]");
          if (!go) return;
          const box = go.closest(".support");
          if (!box) return;
          const floor = Number(box.dataset.floor) || 0;
          const productId = box.dataset.supportProduct;
          const errorEl = box.querySelector("[data-support-error]");
          const input = box.querySelector("input");
          const active = box.querySelector(".support-preset.active");
          let cents;
          if (input && input.value.trim() !== "") {
            const dollars = Number(input.value);
            if (!Number.isFinite(dollars)) {
              if (errorEl) {
                errorEl.textContent = "Enter a valid amount";
                errorEl.classList.remove("hidden");
              }
              return;
            }
            cents = Math.round(dollars * 100);
          } else if (active) {
            cents = Number(active.dataset.cents);
          } else {
            cents = floor;
          }
          if (!Number.isInteger(cents) || cents < floor) {
            if (errorEl) {
              errorEl.textContent = "Minimum is " + money(floor, box.dataset.currency);
              errorEl.classList.remove("hidden");
            }
            return;
          }
          startSupportCheckout(productId, cents, errorEl, go);
        });
      }
      function showCheckoutToast() {
        const q = new URLSearchParams(location.search);
        const flag = q.get("checkout");
        if (flag !== "success" && flag !== "cancel") return;
        const el = document.getElementById("checkout-toast");
        if (!el) return;
        if (flag === "success") {
          el.innerHTML =
            "<strong>PRE-ORDER / SUPPORT CONFIRMED</strong>Thanks — your order is recorded. Downloads unlock on release day. Check the email you used at checkout.";
        } else {
          el.innerHTML =
            "<strong>CHECKOUT CANCELED</strong>No charge was made. You can support the artist anytime from this page.";
        }
        el.classList.remove("hidden");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Dismiss";
        btn.addEventListener("click", () => {
          el.classList.add("hidden");
          const url = new URL(location.href);
          url.searchParams.delete("checkout");
          url.searchParams.delete("session_id");
          history.replaceState({}, "", url.pathname + url.search + url.hash);
        });
        el.appendChild(btn);
      }
      showCheckoutToast();
      load();
    </script>
  </body>
</html>
