name: Validate static release site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check embedded scripts and preview safeguards
        run: node scripts/check-static-html.mjs
      - name: Check studio attach scope, preview quarantine, and analytics owner gate
        run: node scripts/check-studio-asset-guards.mjs
      - name: Check Beatbox intake guards
        run: node scripts/check-beatbox.mjs
      - name: Check publish helpers
        run: node scripts/check-publish-helpers.mjs
      - name: Check owner upload quarantine, beat update race, and verify_jwt pin
        run: node scripts/check-owner-upload-quarantine.mjs
