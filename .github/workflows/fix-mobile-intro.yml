name: Fix mobile intro quality

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-mobile-intro.py"

permissions:
  contents: write

jobs:
  fix-intro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile intro fix
        run: python3 scripts/fix-mobile-intro.py

      - name: Verify intro markup
        run: |
          grep -q 'id="intro-image"' index.html
          grep -q 'object-fit: contain' index.html
          grep -q 'fetchpriority="high"' index.html
          ! grep -q 'id="intro-video"' index.html

      - name: Commit intro fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Rosetta Crew Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix homepage intro quality and mobile framing"
          git push
