<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#080808" />
  <title>Set Music Studio Password | Rosetta Crew</title>
  <style>
    :root{--bg:#080808;--panel:#11100e;--gold:#d2ad56;--gold2:#f2d18a;--text:#f5f0e7;--muted:#9a948a;--line:#302b21;--ok:#82d7a0;--bad:#ff8c8c}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#d2ad5618,transparent 30rem),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input{font:inherit}.wrap{width:min(520px,calc(100% - 28px));margin:8vh auto;padding:28px 24px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.brand{color:var(--gold);font-weight:900;letter-spacing:.18em;font-size:12px}h1{margin:10px 0 8px;font:800 clamp(1.8rem,5vw,2.4rem)/1 Georgia,serif}.muted{color:var(--muted);font-size:13px;line-height:1.5}label{display:block;margin:14px 0 6px;color:#c8bfb1;font-size:13px;font-weight:700}input{width:100%;min-height:46px;border:1px solid #514631;border-radius:11px;background:#090909;color:var(--text);padding:11px 12px}.btn,.ghost{width:100%;min-height:44px;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.btn{border:0;background:linear-gradient(135deg,var(--gold2),#b67d23);color:#110d06}.ghost{border:1px solid #584b34;background:#111;color:var(--text);margin-top:10px}.msg{min-height:1.4rem;margin-top:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">ROSETTA CREW</div>
    <h1>Set Music Studio Password</h1>
    <p class="muted" id="status">Checking your secure Music Studio session…</p>

    <section id="formWrap" class="hidden">
      <p class="muted">Create a password for this approved Music Studio account. Your password is handled directly by Supabase Auth and is never shown to Rosetta Crew administrators.</p>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" placeholder="At least 12 characters" />
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="12" placeholder="Re-enter password" />
      <button id="save" class="btn" type="button">Save password</button>
      <button id="back" class="ghost" type="button">Back to Music Studio</button>
      <div id="msg" class="msg" aria-live="polite"></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const BASE="https://sktgkrcahsxvidzjjxxt.supabase.co";
    const KEY="sb_publishable_lfz4zfwnjuGun259BvK-3A_rR056Bju";
    const API=BASE+"/functions/v1/studio-manager";
    const sb=createClient(BASE,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const q=id=>document.getElementById(id);

    async function currentSession(){
      const {data}=await sb.auth.getSession();
      return data.session;
    }

    async function verifyMusicUploader(session){
      if(!session?.access_token) return false;
      const r=await fetch(API+"?view=whoami",{headers:{Authorization:"Bearer "+session.access_token,apikey:KEY}});
      if(!r.ok) return false;
      const data=await r.json().catch(()=>({}));
      return data.role==="music_uploader";
    }

    async function boot(){
      const session=await currentSession();
      if(!session){
        q("status").textContent="No active Music Studio session. Sign in with your secure email link first, then return here.";
        q("status").className="bad";
        return;
      }
      if(!(await verifyMusicUploader(session))){
        q("status").textContent="This account is not authorized for Music Studio password setup.";
        q("status").className="bad";
        return;
      }
      q("status").textContent="Secure Music Studio account verified.";
      q("status").className="ok";
      q("formWrap").classList.remove("hidden");
    }

    q("save").onclick=async()=>{
      const password=q("password").value;
      const confirm=q("confirm").value;
      q("msg").className="msg";
      if(password.length<12){q("msg").textContent="Use at least 12 characters.";q("msg").classList.add("bad");return;}
      if(password!==confirm){q("msg").textContent="Passwords do not match.";q("msg").classList.add("bad");return;}
      q("save").disabled=true;
      q("msg").textContent="Saving password…";
      const {error}=await sb.auth.updateUser({password});
      if(error){q("msg").textContent=error.message||"Could not save password.";q("msg").classList.add("bad");q("save").disabled=false;return;}
      q("password").value="";q("confirm").value="";
      q("msg").textContent="Password saved. You can now sign in to Music Studio with email and password.";
      q("msg").classList.add("ok");
      q("save").disabled=false;
    };
    q("back").onclick=()=>{location.href="/studio/"};
    boot();
  </script>
</body>
</html>
