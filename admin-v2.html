<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rosetta Release Manager v2</title><style>body{margin:0;background:#070707;color:#f7f3eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.app{max-width:1100px;margin:auto;padding:20px}.top,.row,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.gold{color:#f2d18a}.muted{color:#a39a8c;font-size:12px}.card{background:#11110f;border:1px solid #392f20;border-radius:18px;padding:16px;margin:14px 0}.btn{background:#15120d;color:#fff;border:1px solid #463a25;border-radius:12px;padding:11px 14px;font-weight:800}.btn.primary{background:linear-gradient(135deg,#c79a43,#f1d48c);color:#17120a;border:0}.btn:disabled{opacity:.4}.field{margin:8px 0}.field label{display:block;font-size:11px;color:#f2d18a;margin-bottom:5px}.field input,.field textarea{width:100%;box-sizing:border-box;background:#0a0a09;color:#fff;border:1px solid #3a3123;border-radius:10px;padding:10px}.grid{display:grid;gap:12px}.hide{display:none}.status{padding:5px 8px;border-radius:999px;border:1px solid #463a25;color:#f2d18a;font-size:10px}.ok{color:#74d99f}.bad{color:#ff8d8d}.warn{color:#f0c46c}.thumb{width:84px;height:84px;object-fit:contain;background:#0b0b0b;border-radius:12px;border:1px solid #463a25}.preview{position:fixed;inset:0;background:#080808;z-index:50;display:none;overflow:auto}.preview.show{display:block}.previewbar{position:sticky;top:0;background:#0b0b0a;border-bottom:1px solid #392f20;padding:12px;display:flex;justify-content:space-between}.store{max-width:650px;margin:35px auto;text-align:center;padding:20px}.store img{width:min(82vw,420px);aspect-ratio:1;object-fit:contain;background:#111;border-radius:22px}.store h1{font:700 58px/1 Georgia,serif;margin:24px 0 8px}.login{position:fixed;inset:0;background:#050505;z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}.loginbox{width:min(460px,100%)}@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}</style></head><body><div id="login" class="login"><div class="loginbox card"><div class="gold">OWNER ACCESS</div><h2>Release Manager v2</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><div class="actions"><button id="signin" class="btn primary">Sign In</button></div><hr style="border:0;border-top:1px solid #392f20;margin:18px 0"><div class="field"><label>Recovery key</label><input id="key" type="password"></div><button id="keyin" class="btn">Unlock With Key</button><div id="loginmsg" class="muted" style="margin-top:8px"></div></div></div><div class="app"><div class="top"><div><div class="gold">ROSETTA CREW</div><h1 style="margin:3px 0">Release Manager v2</h1><div class="muted">Edit → Validate → Save Draft → Preview → Publish</div></div><button id="signout" class="btn">Sign Out</button></div><div class="card"><strong>Launch readiness</strong><div class="muted">Publish is blocked until artwork passes validation, audio exists, price is set, and a release date exists.</div><div id="summary" class="row" style="margin-top:10px"></div></div><div id="list"></div></div><div id="preview" class="preview"><div class="previewbar"><strong>Private Preview</strong><button id="closeprev" class="btn primary">Back to Admin</button></div><div class="store"><img id="pc" alt="cover"><h1 id="pt"></h1><div id="pa" class="gold"></div><div id="pp" style="font-size:34px;font-weight:900;margin:18px 0"></div><p id="pd" class="muted" style="font-size:15px"></p><button class="btn primary" style="width:100%">PREVIEW BUY BUTTON</button></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const U='https://sktgkrcahsxvidzjjxxt.supabase.co',K='sb_publishable_lfz4zfwnjuGun259BvK-3A_rR056Bju',M=U+'/functions/v1/release-manager',sb=createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}});let rk=sessionStorage.getItem('rosetta_admin_key')||'',sess=null,releases=[];const $=s=>document.querySelector(s),money=c=>'$'+((Number(c)||0)/100).toFixed(2),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(body=null){const{data}=await sb.auth.getSession();sess=data.session;const h={'content-type':'application/json'};if(sess?.access_token)h.authorization='Bearer '+sess.access_token;if(rk)h['x-admin-key']=rk;const r=await fetch(M,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):null});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function enter(){try{const j=await api();releases=j.releases||[];$('#login').style.display='none';render()}catch(e){$('#loginmsg').textContent=e.message}}$('#signin').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error)return $('#loginmsg').textContent=error.message;enter()};$('#keyin').onclick=()=>{rk=$('#key').value.trim();sessionStorage.setItem('rosetta_admin_key',rk);enter()};$('#signout').onclick=async()=>{sessionStorage.removeItem('rosetta_admin_key');await sb.auth.signOut();location.reload()};(async()=>{if((await sb.auth.getSession()).data.session||rk)enter()})();function cover(r){return r.cover_art_bucket==='release-public'&&r.cover_art_path?`${U}/storage/v1/object/public/release-public/${r.cover_art_path}`:''}function ready(r){const v=r.metadata?.artwork_validation;return{art:!!r.cover_art_path&&v?.ready===true,audio:(r.tracks?.length||0)>0,price:Number(r.release_price_cents??r.presale_price_cents)>0,date:!!r.release_at}}function render(){let rr=0;for(const r of releases){const q=ready(r);if(Object.values(q).every(Boolean))rr++}$('#summary').innerHTML=`<span class="status">${releases.length} releases</span><span class="status ok">${rr} ready</span><span class="status warn">${releases.length-rr} need attention</span>`;$('#list').innerHTML='';for(const r of releases){const q=ready(r),all=Object.values(q).every(Boolean),c=cover(r),v=r.metadata?.artwork_validation,el=document.createElement('div');el.className='card';el.innerHTML=`<div class="top"><div class="row">${c?`<img class="thumb" src="${c}">`:''}<div><strong>${esc(r.artist_name)} — ${esc(r.title)}</strong><div class="muted">${money(r.release_price_cents??r.presale_price_cents)} · ${esc(r.status)}</div><div class="muted ${all?'ok':'warn'}">${all?'READY TO PUBLISH':'NEEDS ATTENTION'}</div></div></div><span class="status">${esc(r.product_type||'release')}</span></div><div class="muted" style="margin-top:8px">Artwork: ${v?`${v.width}×${v.height} · ${v.ready?'PASS':'FAIL'}`:'not validated'} · Audio: ${r.tracks?.length||0}</div><div class="actions" style="margin-top:10px"><button class="btn" data-e>Edit</button><button class="btn" data-c>Validate + Upload Cover</button><button class="btn" data-a>Upload Audio</button><button class="btn" data-v>Preview</button><button class="btn primary" data-p ${all?'':'disabled'}>Publish</button></div><div class="hide" data-ed><div class="grid two"><div class="field"><label>Artist</label><input data-artist value="${esc(r.artist_name)}"></div><div class="field"><label>Title</label><input data-title value="${esc(r.title)}"></div><div class="field"><label>Price</label><input data-price type="number" step=".01" value="${((r.release_price_cents??r.presale_price_cents??0)/100).toFixed(2)}"></div><div class="field"><label>Release date</label><input data-date type="datetime-local" value="${local(r.release_at)}"></div></div><div class="field"><label>Description</label><textarea data-desc>${esc(r.description||'')}</textarea></div><button class="btn primary" data-save>Save Draft Changes</button></div><input class="hide" data-cf type="file" accept="image/jpeg,image/png"><input class="hide" data-af type="file" accept="audio/mpeg,audio/wav,.mp3,.wav">`;$('#list').appendChild(el);el.querySelector('[data-e]').onclick=()=>el.querySelector('[data-ed]').classList.toggle('hide');el.querySelector('[data-save]').onclick=()=>save(r,el);el.querySelector('[data-c]').onclick=()=>el.querySelector('[data-cf]').click();el.querySelector('[data-cf]').onchange=e=>uploadCover(r,e.target.files[0]);el.querySelector('[data-a]').onclick=()=>el.querySelector('[data-af]').click();el.querySelector('[data-af]').onchange=e=>uploadAudio(r,e.target.files[0]);el.querySelector('[data-v]').onclick=()=>preview(r);el.querySelector('[data-p]').onclick=()=>publish(r)}}function local(v){if(!v)return'';const d=new Date(v),z=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}async function save(r,el){try{await api({action:'update_release',id:r.id,artist_name:el.querySelector('[data-artist]').value,title:el.querySelector('[data-title]').value,description:el.querySelector('[data-desc]').value,release_price_cents:Math.round(+el.querySelector('[data-price]').value*100),presale_price_cents:Math.round(+el.querySelector('[data-price]').value*100),release_at:new Date(el.querySelector('[data-date]').value).toISOString(),status:'draft',storefront_enabled:false});enter()}catch(e){alert(e.message)}}function inspect(f){return new Promise((res,rej)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const o={width:i.naturalWidth,height:i.naturalHeight,square:i.naturalWidth===i.naturalHeight,size:f.size,format:f.type,ready:i.naturalWidth>=3000&&i.naturalHeight>=3000&&i.naturalWidth===i.naturalHeight&&f.size<=10485760&&['image/jpeg','image/png'].includes(f.type)};URL.revokeObjectURL(u);res(o)};i.onerror=()=>rej(Error('Unable to read artwork'));i.src=u})}async function uploadCover(r,f){if(!f)return;try{const v=await inspect(f);if(!v.square)throw Error(`Cover must be square. This file is ${v.width}×${v.height}.`);if(!v.ready)throw Error(`Cover must be JPG/PNG and at least 3000×3000. This file is ${v.width}×${v.height}.`);const s=await api({action:'signed_upload',product_id:r.id,kind:'cover',filename:f.name}),u=await sb.storage.from(s.bucket).uploadToSignedUrl(s.path,s.token,f,{contentType:f.type});if(u.error)throw u.error;await api({action:'attach_asset',product_id:r.id,kind:'cover',path:s.path});await api({action:'update_release',id:r.id,metadata:{...(r.metadata||{}),artwork_validation:{...v,validated_at:new Date().toISOString()}}});enter()}catch(e){alert(e.message)}}async function uploadAudio(r,f){if(!f)return;try{const ext=f.name.split('.').pop().toLowerCase();if(!['mp3','wav'].includes(ext))throw Error('Audio must be MP3 or WAV');const n=(r.tracks?.length||0)+1,tr=await api({action:'add_track',product_id:r.id,track_number:n,title:f.name.replace(/\.[^.]+$/,''),filename:f.name}),s=await api({action:'signed_upload',product_id:r.id,kind:'track',filename:f.name,object_path:tr.track.audio_object_path}),u=await sb.storage.from(s.bucket).uploadToSignedUrl(s.path,s.token,f,{contentType:f.type||'application/octet-stream'});if(u.error)throw u.error;enter()}catch(e){alert(e.message)}}function preview(r){$('#pc').src=cover(r);$('#pt').textContent=r.title;$('#pa').textContent=r.artist_name.toUpperCase();$('#pp').textContent=money(r.release_price_cents??r.presale_price_cents);$('#pd').textContent=r.description||'';$('#preview').classList.add('show')}$('#closeprev').onclick=()=>$('#preview').classList.remove('show');async function publish(r){try{await api({action:'publish',product_id:r.id});enter()}catch(e){alert(e.message)}}</script></body></html>
